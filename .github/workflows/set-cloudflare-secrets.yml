name: Set Cloudflare secrets

# Sets the Worker's runtime secrets without needing a terminal on your computer.
#
# You store the values as GitHub repository secrets (a web form), then run this from the
# Actions tab. It hands them to Cloudflare for you. `wrangler secret put` deploys each
# one straight away, so there is no separate deploy step afterwards.
#
# Requires these GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN   Cloudflare > My Profile > API Tokens ("Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare > Workers & Pages > Account details
#   GOOGLE_CLIENT_ID       the OAuth client from Google Cloud (see SETUP.md)
#   GOOGLE_CLIENT_SECRET   the same client's secret
#   ADMIN_EMAILS           Google accounts allowed into the control panel, comma-separated
#
# The Worker it targets is the "name" in wrangler.jsonc ("wedding").

on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check what was provided
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Cloudflare credentials are present."

      - name: Send GOOGLE_CLIENT_ID to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.GOOGLE_CLIENT_ID }}
        # Checked in the shell rather than a step-level `if`, because the secrets context
        # is not dependably available there.
        run: |
          if [ -z "$VALUE" ]; then
            echo "::warning::GOOGLE_CLIENT_ID is not set — skipping. Sign-in won't work until it is."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put GOOGLE_CLIENT_ID

      - name: Send GOOGLE_CLIENT_SECRET to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$VALUE" ]; then
            echo "::warning::GOOGLE_CLIENT_SECRET is not set — skipping. Sign-in won't work until it is."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put GOOGLE_CLIENT_SECRET

      - name: Send ADMIN_EMAILS to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.ADMIN_EMAILS }}
        run: |
          if [ -z "$VALUE" ]; then
            echo "::warning::ADMIN_EMAILS is not set — skipping. Nobody can sign in to the control panel until it is."
            exit 0
          fi
          printf '%s' "$VALUE" | npx --yes wrangler@4 secret put ADMIN_EMAILS

      - name: What to do next
        run: |
          echo "Done. Open https://wedding.<your-subdomain>.workers.dev/api/config-check"
          echo "You are looking for \"ready\": true"
