<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<title>Sign in — Wedding planner</title>
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .login { max-width: 380px; margin: 12vh auto 0; text-align: center; }
  .login .card { padding: 28px 24px; }
  .login h1 { margin-bottom: 6px; }
  .google { justify-content: center; width: 100%; padding: 11px 14px; font-weight: 600; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap login">
  <div class="card">
    <h1>Wedding planner</h1>
    <p class="sub">Control panel. Sign in with the Google account on the admin list.</p>
    <a class="btn google" id="signin" href="/api/auth/login">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.5z"/></svg>
      Sign in with Google
    </a>
    <p class="msg err" id="msg"></p>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const error = params.get("error");
  // Back to the page that sent you here (the expense form), once you're signed in.
  const next = /^\/(?!\/)/.test(params.get("next") || "") ? params.get("next") : "";
  if (next) document.getElementById("signin").href = `/api/auth/login?next=${encodeURIComponent(next)}`;
  if (error) document.getElementById("msg").textContent = error;
  else fetch("/api/auth/me").then((r) => { if (r.ok) location.href = next || "/admin/index.html"; });
</script>
</body>
</html>
