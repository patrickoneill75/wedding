<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<title>Expenses — Wedding planner</title>
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .preview { background: var(--wash); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .preview b { font-variant-numeric: tabular-nums; }
  td .muted { font-size: 12px; }
  tfoot td { font-weight: 650; background: var(--surface-2); }
  td .sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  button.toggle { border: 0; background: none; padding: 0 6px 0 0; color: var(--text-muted); font-size: 11px; }
  tr.child td { background: var(--wash); }
  tr.child td.child-name { padding-left: 34px; }
  tr.add-line td { background: var(--wash); padding-left: 34px; }
  .done-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar"></div>
  <div class="row" style="margin-bottom:6px">
    <div>
      <h1>Expenses</h1>
      <p class="sub" id="subtitle" style="margin:0"></p>
    </div>
    <span class="spacer"></span>
    <button id="formLinkBtn">Copy expense form link</button>
    <button class="primary" id="addBtn">+ Add expense</button>
  </div>
  <p class="msg" id="topMsg"></p>

  <div class="filters">
    <input type="search" id="search" placeholder="Search items, vendors, notes…">
    <select id="catFilter"><option value="">All categories</option></select>
    <select id="statusFilter"><option value="">All stages</option></select>
    <label class="check"><input type="checkbox" id="unpricedOnly"> Needs a price</label>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Item</th><th>Stage</th><th class="num" title="Estimates and quotes: not committed to yet">Estimated</th><th class="num" title="Booked or paid for">Incurred</th>
        <th class="num">Paid</th><th class="num">Owed</th><th>Due</th>
      </tr></thead>
      <tbody id="rows"></tbody>
      <tfoot id="foot"></tfoot>
    </table>
  </div>
</div>

<script type="module">
import { api, initPage, h, money, fmtDate, today, statusPill, openDialog, field, check, formValues, setMsg } from "/admin/admin.js";
import { combobox } from "/admin/combobox.js";

await initPage("expenses.html");
let data;
const STAGES = ["estimate", "quote", "booked", "partially_paid", "paid"];

async function load() {
  data = await api("/api/admin/expenses");
  const cats = [...new Set(data.expenses.map((e) => e.category).filter(Boolean))].sort();
  const catFilter = document.getElementById("catFilter");
  const keep = catFilter.value;
  catFilter.replaceChildren(h("option", { value: "" }, "All categories"), ...cats.map((c) => h("option", { value: c, selected: c === keep }, c)));
  const statusFilter = document.getElementById("statusFilter");
  if (statusFilter.options.length === 1) {
    // In progress is only ever an item's stage worked out from its line items.
    const stages = [...data.statuses];
    stages.splice(stages.indexOf("partially_paid"), 0, "in_progress");
    for (const s of stages) statusFilter.append(h("option", { value: s }, data.status_labels[s]));
  }
  const basisText = data.basis === "confirmed" ? `${data.basis_count} confirmed guests` : `${data.basis_count} weighted invites`;
  document.getElementById("subtitle").textContent =
    `Per-guest items are priced on ${basisText}. Tax is ${Math.round(data.settings.tax_rate * 1000) / 10}% on taxable items.`;
  renderRows();
}

const SHORT_SOURCES = { guests: "guests", invited: "invited", households: "households" };

/** How a price is made up ("$85 × 124 guests + tax"), or null when it's just the price. */
function pricingLine(e) {
  if (!e.priced) return null;
  let qty = "";
  if (e.pricing === "variable") {
    const src = SHORT_SOURCES[e.quantity_source] || (data.quantity_sources[e.quantity_source] || e.quantity_source).replace(/^Drinks: /, "");
    qty = ` × ${e.quantity} ${src}`;
  } else if (Number(e.units) !== 1) qty = ` × ${e.units}`;
  const extras = [e.taxable ? "tax" : "", e.gratuity_rate ? `${Math.round(e.gratuity_rate * 100)}% gratuity` : ""].filter(Boolean);
  if (!qty && !extras.length) return null;
  return `${money(e.unit_cost)}${qty}${extras.map((x) => ` + ${x}`).join("")}`;
}

// Items whose line items are showing. Filtering opens any item with a matching line item.
const expanded = new Set();

function renderRows() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cat = document.getElementById("catFilter").value;
  const status = document.getElementById("statusFilter").value;
  const unpriced = document.getElementById("unpricedOnly").checked;
  const filtering = Boolean(q || status || unpriced);
  const matches = (e) =>
    (!cat || e.category === cat) && (!status || e.status === status) && (!unpriced || (!e.priced && e.status !== "cancelled")) &&
    (!q || [e.item, e.vendor, e.notes, e.category, e.subcategory].some((v) => String(v || "").toLowerCase().includes(q)));
  const kidsOf = new Map();
  for (const e of data.expenses) if (e.parent_id) (kidsOf.get(e.parent_id) || kidsOf.set(e.parent_id, []).get(e.parent_id)).push(e);
  const shown = data.expenses.filter((e) => !e.parent_id && (matches(e) || (kidsOf.get(e.id) || []).some(matches)));
  const dueCell = (e) => h("td", {}, e.due_date ? (e.due_date < today() && e.owed > 0 ? h("span", { class: "pill overdue" }, fmtDate(e.due_date)) : fmtDate(e.due_date)) : "");
  // Owed here is what's committed and not yet paid; an estimate or quote isn't owed.
  const owedNow = (e) => Math.max(Math.round((e.incurred - e.paid) * 100) / 100, 0);
  // Every dollar of an item's cost is in Estimated or Incurred; the price breakdown (or
  // nothing, for an item with line items) sits under whichever has most of it.
  const amount = (n, sub) => (n ? [money(n), sub] : sub ? ["—", sub] : "—");
  const moneyCells = (e, sub) => [
    ...(!e.priced && !e.paid
      ? [h("td", { class: "num" }, h("span", { class: "sub" }, "No price yet")), h("td", { class: "num" }, "—")]
      : [h("td", { class: "num" }, amount(e.estimated, e.estimated >= e.incurred ? sub : null)),
         h("td", { class: "num" }, amount(e.incurred, e.estimated < e.incurred ? sub : null))]),
    h("td", { class: "num" }, e.paid ? money(e.paid) : "—"),
    h("td", { class: "num" }, owedNow(e) ? money(owedNow(e)) : "—"),
  ];
  const priceSub = (e) => (pricingLine(e) ? h("div", { class: "sub" }, pricingLine(e)) : null);
  const rows = [];
  let group = null;
  for (const e of shown) {
    const key = `${e.category} · ${e.subcategory}`;
    if (key !== group) {
      group = key;
      rows.push(h("tr", { class: "group" }, h("td", { colspan: 7 }, e.subcategory ? `${e.category} — ${e.subcategory}` : e.category || "Uncategorized")));
    }
    const kids = kidsOf.get(e.id) || [];
    const open = kids.length && (expanded.has(e.id) || (filtering && kids.some(matches)));
    const toggle = () => { expanded.has(e.id) ? expanded.delete(e.id) : expanded.add(e.id); renderRows(); };
    rows.push(h("tr", { class: "clickable", onclick: () => (kids.length ? toggle() : openEditor(e.id)) },
      h("td", {},
        kids.length ? h("button", { class: "toggle", "aria-label": open ? "Hide line items" : "Show line items",
          onclick: (ev) => { ev.stopPropagation(); toggle(); } }, open ? "▼" : "▶") : null,
        kids.length ? h("a", { href: `#${e.id}`, onclick: (ev) => { ev.preventDefault(); ev.stopPropagation(); openEditor(e.id); } }, e.item) : e.item,
        kids.length || e.vendor ? h("div", { class: "sub" }, kids.length ? `${kids.length} line item${kids.length === 1 ? "" : "s"}` : e.vendor) : null),
      h("td", {}, statusPill(e.status, data.status_labels)),
      ...moneyCells(e, kids.length ? null : priceSub(e)),
      dueCell(e),
    ));
    if (!open) continue;
    for (const k of kids) {
      rows.push(h("tr", { class: "clickable child", onclick: () => openEditor(k.id) },
        h("td", { class: "child-name" }, k.item, k.vendor ? h("div", { class: "sub" }, k.vendor) : null),
        h("td", {}, statusPill(k.status, data.status_labels)),
        ...moneyCells(k, priceSub(k)),
        dueCell(k),
      ));
    }
    rows.push(h("tr", { class: "add-line" }, h("td", { colspan: 7 },
      h("button", { class: "small", onclick: () => openEditor(null, { parentId: e.id }) }, `+ Add a line item to ${e.item}`))));
  }
  if (!shown.length) rows.push(h("tr", {}, h("td", { colspan: 7, class: "muted" }, data.expenses.length ? "Nothing matches those filters." : "No expenses yet. Add one, or import the spreadsheet in Settings.")));
  document.getElementById("rows").replaceChildren(...rows);
  // Totals over items only: an item already includes its line items.
  const sum = (k) => shown.reduce((s, e) => s + (e[k] || 0), 0);
  document.getElementById("foot").replaceChildren(h("tr", {},
    h("td", { colspan: 2 }, `${shown.length} items`),
    h("td", { class: "num" }, money(sum("estimated"))), h("td", { class: "num" }, money(sum("incurred"))),
    h("td", { class: "num" }, money(sum("paid"))), h("td", { class: "num" }, money(shown.reduce((t, e) => t + owedNow(e), 0))), h("td", {})));
}

for (const id of ["search", "catFilter", "statusFilter", "unpricedOnly"]) {
  document.getElementById(id).addEventListener("input", renderRows);
}
document.getElementById("addBtn").addEventListener("click", () => openEditor(null));
document.getElementById("formLinkBtn").addEventListener("click", async () => {
  const msg = document.getElementById("topMsg");
  try {
    const { url } = await api("/api/admin/form-link");
    await navigator.clipboard.writeText(url).catch(() => {});
    setMsg(msg, `Copied: ${url} — anyone with this link can add expenses, so only share it with each other. Rotate it in Settings.`, "ok");
  } catch (error) {
    setMsg(msg, error.message, "err");
  }
});

/* ------------------------------------------------------------ preview math --
 * Mirrors src/calc.js so the editor can show the total before saving. The server
 * recomputes on save; this is display only. */
function sourceValue(source) {
  if (source === "guests") return data.basis_count;
  if (source === "invited") return data.counts.invited;
  if (source === "households") return data.counts.households;
  if (source.startsWith("drinks:")) return data.drinks[source.slice(7)] ?? 0;
  return 0;
}
function previewTotals(v) {
  let qty;
  if (v.pricing === "variable") {
    const raw = sourceValue(v.quantity_source) * (Number(v.quantity_factor) || 1);
    qty = v.round_up ? Math.ceil(raw - 1e-9) : Math.round(raw * 100) / 100;
  } else qty = Number(v.units) || 0;
  const subtotal = Math.round((Number(v.unit_cost) || 0) * qty * 100) / 100;
  const tax = v.taxable ? Math.round(subtotal * data.settings.tax_rate * 100) / 100 : 0;
  const grat = Math.round(subtotal * ((Number(v.gratuity_percent) || 0) / 100) * 100) / 100;
  return { qty, subtotal, tax, grat, total: subtotal + tax + grat };
}

/* ----------------------------------------------------------------- editor -- */

/** Category and subcategory inputs that suggest as you type; picking a pair fills both. */
function categoryFields(e) {
  const cat = h("input", { name: "category", value: e.category || "", placeholder: "Type to find one, or a new one" });
  const sub = h("input", { name: "subcategory", value: e.subcategory || "" });
  cat.value = e.category || "";
  sub.value = e.subcategory || "";
  const pairs = () => {
    const seen = new Map();
    for (const x of data.expenses) {
      if (x.parent_id || !x.category) continue;
      seen.set(`${x.category}\u0000`, [x.category, ""]);
      if (x.subcategory) seen.set(`${x.category}\u0000${x.subcategory}`, [x.category, x.subcategory]);
    }
    return [...seen.values()].sort((a, b) => `${a[0]} ${a[1]}`.localeCompare(`${b[0]} ${b[1]}`))
      .map(([c, sc]) => ({ label: sc ? `${c} › ${sc}` : c, search: `${c} ${sc}`, c, sc }));
  };
  const catBox = combobox(cat, { options: pairs, showAll: true, onPick: (o) => { cat.value = o.c; sub.value = o.sc; } });
  const subBox = combobox(sub, {
    showAll: true,
    options: () => [...new Set(data.expenses.filter((x) => x.category === cat.value && x.subcategory).map((x) => x.subcategory))].sort().map((x) => ({ label: x })),
    onPick: (o) => { sub.value = o.label; },
  });
  return [h("label", { class: "field" }, "Category", catBox), h("label", { class: "field" }, "Subcategory", subBox)];
}

function vendorField(value) {
  const input = h("input", { name: "vendor", placeholder: "Type to find one, or a new one" });
  input.value = value || "";
  const box = combobox(input, {
    showAll: true,
    options: () => data.vendors.map((v) => ({ label: v })),
    create: (typed) => (data.vendors.some((v) => v.toLowerCase() === typed.toLowerCase()) ? null : { label: `＋ New vendor “${typed}”`, text: typed }),
    onPick: (o) => { input.value = o.text ?? o.label; },
  });
  return h("label", { class: "field" }, "Vendor", box);
}

/**
 * Edit an expense, or make a new one. There are three kinds:
 *   an item on its own        vendor, stage, price and payments, like one booking
 *   an item with line items   a container: name and category; it adds up the line items
 *                             under it have the vendors, stages and payments
 *   a line item               a booking under an item (`parentId` for a new one)
 * `returnTo` reopens that item's editor afterwards.
 */
async function openEditor(id, { parentId = null, returnTo = null } = {}) {
  let detail = null;
  if (id) detail = await api(`/api/admin/expenses/${id}`);
  const e = detail?.expense || {
    category: "", subcategory: "", item: "", vendor: "", status: "estimate", pricing: "fixed", unit_cost: null, units: 1,
    quantity_source: "guests", quantity_factor: 1, round_up: 0, taxable: 0, gratuity_rate: 0, due_date: "", due_amount: null, payer: "", notes: "",
  };
  const parent = data.expenses.find((x) => x.id === (e.parent_id || parentId)) || null;
  const isLine = Boolean(parent);
  const isContainer = Boolean(e.purchases);
  history.replaceState(null, "", id ? `#${id}` : location.pathname);

  const title = id ? (isLine ? `${parent.item} › ${e.item}` : e.item) : isLine ? `New line item for ${parent.item}` : "New expense";
  await openDialog(title, (close) => {
    // A container's stage comes from its line items; it's only open, done buying, or cancelled.
    let status = isContainer ? (e.own_status === "cancelled" ? "cancelled" : e.done ? "paid" : "open") : e.status;
    const paidNote = h("p", { class: "desc", style: "margin:6px 0 0" });
    const form = h("form", { onsubmit: (ev) => ev.preventDefault() });
    const msg = h("p", { class: "msg" });
    const preview = h("div", { class: "preview" });

    const stepper = h("div", { class: "stepper" });
    const drawStepper = () => {
      const at = STAGES.indexOf(status);
      stepper.replaceChildren(...STAGES.flatMap((s, i) => [
        i ? h("span", { class: "arrow" }, "→") : null,
        h("button", { type: "button", class: s === status ? "current" : at > i ? "done" : "", onclick: () => { status = s; drawStepper(); } }, data.status_labels[s]),
      ].filter(Boolean)), h("span", { class: "spacer" }),
      h("button", { type: "button", class: status === "cancelled" ? "current" : "danger", onclick: () => { status = status === "cancelled" ? "estimate" : "cancelled"; drawStepper(); } },
        status === "cancelled" ? "Cancelled" : "Cancel item"));
      paidNote.textContent = status !== "paid" ? ""
        : "Saving as Paid records a payment for whatever is still owed (dated today, paid by whoever is under Who's paying).";
    };

    const doneBox = h("input", { type: "checkbox", checked: status === "paid", onchange: () => { status = doneBox.checked ? "paid" : "open"; drawDone(); } });
    const cancelBtn = h("button", { type: "button", onclick: () => { status = status === "cancelled" ? "open" : "cancelled"; doneBox.checked = false; drawDone(); } });
    const drawDone = () => {
      cancelBtn.className = status === "cancelled" ? "small current" : "small danger";
      cancelBtn.textContent = status === "cancelled" ? "Cancelled (undo)" : "Cancel item";
      doneBox.disabled = status === "cancelled";
    };

    const stageBlock = isContainer
      ? h("div", { class: "field", style: "margin-bottom:12px; font-size:12.5px; color:var(--text-secondary)" },
          h("div", {}, "Stage: ", statusPill(e.status, data.status_labels), " — set by its line items"),
          h("div", { class: "done-row" },
            h("label", { class: "check" }, doneBox, "Done buying (no more line items to come)"),
            cancelBtn))
      // A div, not a label: a label forwards every click inside it to its first button.
      : h("div", { class: "field", style: "margin-bottom:12px; font-size:12.5px; color:var(--text-secondary)" }, "Stage — click to move it along; skipping stages is fine", stepper, paidNote);
    if (isContainer) drawDone(); else drawStepper();

    const payerOptions = [["", "—"], ...data.settings.payers.map((p) => [p, p])];
    const sourceOptions = Object.entries(data.quantity_sources);
    const variableFields = h("div", { class: "fields" },
      field("Quantity comes from", "quantity_source", { options: sourceOptions, value: e.quantity_source, onchange: update }),
      field("Multiply by", "quantity_factor", { type: "number", step: "any", value: e.quantity_factor, oninput: update }),
      h("label", { class: "check", style: "align-self:end; padding-bottom:8px" }, h("input", { type: "checkbox", name: "round_up", checked: Boolean(e.round_up), onchange: update }), "Round up"),
    );
    const fixedFields = h("div", { class: "fields" }, field("Units", "units", { type: "number", step: "any", value: e.units, oninput: update }));

    // Filtered: append() turns a null into the text "null".
    form.append(...[
      stageBlock,
      h("div", { class: "fields" },
        field(isLine ? "What was bought" : "Item", "item", { value: e.item, required: true, placeholder: isLine ? "e.g. 40 dinner plates" : "" }),
        isContainer ? null : vendorField(e.vendor),
        // A line item files under its item's category.
        ...(isLine ? [] : categoryFields(e)),
      ),
      // An item with line items has no price of its own: it adds up its line items.
      isContainer ? null : h("div", {}, h("div", { class: "row", style: "margin-bottom:10px" },
        h("label", { class: "check" }, h("input", { type: "radio", name: "pricing", value: "fixed", checked: e.pricing !== "variable", onchange: update }), "Fixed price"),
        h("label", { class: "check" }, h("input", { type: "radio", name: "pricing", value: "variable", checked: e.pricing === "variable", onchange: update }), "Variable (scales with guests or drinks)"),
      ),
      h("div", { class: "fields" },
        field("Price per unit ($)", "unit_cost", { type: "number", step: "0.01", value: e.unit_cost ?? "", oninput: update }),
        field("Gratuity %", "gratuity_percent", { type: "number", step: "any", value: Math.round((e.gratuity_rate || 0) * 10000) / 100, oninput: update }),
        h("label", { class: "check", style: "align-self:end; padding-bottom:8px" }, h("input", { type: "checkbox", name: "taxable", checked: Boolean(e.taxable), onchange: update }), `Taxable (${Math.round(data.settings.tax_rate * 1000) / 10}%)`),
      ),
      fixedFields,
      variableFields,
      preview),
      isContainer ? null : h("div", { class: "fields" },
        field("Next payment due", "due_date", { type: "date", value: e.due_date || "" }),
        field("Amount due ($)", "due_amount", { type: "number", step: "0.01", value: e.due_amount ?? "", placeholder: "Defaults to what's owed" }),
        field("Who's paying", "payer", { options: payerOptions, value: e.payer || "" }),
      ),
      h("div", { class: "fields" },
        field("Notes", "notes", { type: "textarea", value: e.notes || "", wide: true }),
        id ? field("What changed? (saved to the price history)", "history_note", { placeholder: "e.g. Got the final quote from the venue", wide: true }) : null,
      ),
      h("div", { class: "row" },
        h("button", { type: "button", class: "primary", onclick: save }, id ? "Save changes" : isLine ? "Add line item" : "Add expense"),
        id ? h("button", { type: "button", class: "danger", onclick: remove }, "Delete") : null,
      ),
      msg,
    ].filter(Boolean));

    function update() {
      const v = formValues(form);
      const variable = v.pricing === "variable";
      variableFields.hidden = !variable;
      fixedFields.hidden = variable;
      const t = previewTotals(v);
      preview.replaceChildren(
        h("div", {}, `${money(Number(v.unit_cost) || 0)} × ${t.qty} = `, h("b", {}, money(t.subtotal)),
          t.tax ? ` + tax ${money(t.tax)}` : "", t.grat ? ` + gratuity ${money(t.grat)}` : "", " = ", h("b", {}, money(t.total))),
        variable && v.quantity_source === "guests"
          ? h("div", { class: "muted" }, `Guest count is ${data.basis_count} (${data.basis}). It updates on its own as the guest list and RSVPs change.`) : "",
      );
    }
    update();

    async function save() {
      const v = formValues(form);
      let saveStatus = status;
      // Re-opening a done item keeps its frozen estimate (Estimate would re-open that too).
      if (isContainer && status === "open") saveStatus = ["paid", "cancelled"].includes(e.own_status) ? (e.baseline_total == null ? "estimate" : "booked") : e.own_status;
      const payload = {
        ...v,
        status: saveStatus,
        gratuity_rate: (Number(v.gratuity_percent) || 0) / 100,
        unit_cost: v.unit_cost === "" ? null : v.unit_cost,
      };
      if ("due_amount" in v) payload.due_amount = v.due_amount === "" ? null : v.due_amount;
      delete payload.gratuity_percent;
      if (!id && isLine) payload.parent_id = parent.id;
      try {
        if (id) await api(`/api/admin/expenses/${id}`, { method: "PUT", body: payload });
        else await api("/api/admin/expenses", { method: "POST", body: payload });
        close(true);
      } catch (error) {
        setMsg(msg, error.message, "err");
      }
    }
    async function remove() {
      const extra = isContainer ? `, its ${e.purchases} line item${e.purchases === 1 ? "" : "s"},` : "";
      if (!confirm(`Delete "${e.item}"${extra} and its payments and history?`)) return;
      await api(`/api/admin/expenses/${id}`, { method: "DELETE" });
      close(true);
    }

    // Line items lead for a container; for an item on its own they're an offer, after the form.
    const lines = id && !isLine ? lineItemsSection(id, detail, close) : null;
    const sections = isContainer ? [lines, form] : [form, lines];
    // An item that got line items before they took over its payments may still have some.
    if (id && (!isContainer || detail.payments.length)) sections.push(paymentsSection(id, detail, close));
    if (id) sections.push(attachmentsSection(id, detail), historySection(detail));
    return h("div", {}, ...sections);
  });
  history.replaceState(null, "", location.pathname);
  await load();
  if (returnTo) await openEditor(returnTo);
}

function lineItemsSection(id, detail, closeDialog) {
  const e = detail.expense;
  const list = e.purchase_list || [];
  const open = (kidId, opts = {}) => {
    closeDialog(true);
    openEditor(kidId, { ...opts, returnTo: id });
  };
  const add = h("button", { type: "button", class: list.length ? "small primary" : "small", style: "margin-top:10px", onclick: () => open(null, { parentId: id }) }, "+ Add a line item");
  if (!list.length) {
    return h("section", {}, h("h3", {}, "Line items"),
      h("p", { class: "desc", style: "margin:0" }, "Buying this in pieces, or from more than one vendor? Add line items. "
        + "What's already on this item (its price, vendor, stage and payments) becomes the first line item, and the item adds up its line items from then on."),
      add);
  }
  return h("section", { style: "margin-bottom:16px" },
    h("h3", {}, `Line items · ${money(e.estimated)} estimated · ${money(e.incurred)} incurred · ${money(e.paid)} paid`),
    h("div", { class: "list" }, list.map((k) => h("div", { class: "item", style: "cursor:pointer", onclick: () => open(k.id) },
      h("b", {}, k.item), k.vendor ? h("span", { class: "muted" }, k.vendor) : null, statusPill(k.status, data.status_labels),
      h("span", { class: "spacer" }), h("span", {}, money(k.projected)), k.incurred - k.paid > 0.004 ? h("span", { class: "muted" }, `${money(k.incurred - k.paid)} owed`) : null))),
    add);
}

function paymentsSection(id, detail, closeDialog) {
  const msg = h("p", { class: "msg" });
  const form = h("form", { onsubmit: (ev) => ev.preventDefault() },
    h("div", { class: "fields" },
      field("Amount ($)", "amount", { type: "number", step: "0.01", value: detail.expense.owed || "" }),
      field("Date paid", "paid_on", { type: "date", value: today() }),
      field("Paid by", "payer", { options: [["", "—"], ...data.settings.payers.map((p) => [p, p])], value: detail.expense.payer || "" }),
      field("Method", "method", { options: [["", "—"], ...data.settings.payment_methods.map((p) => [p, p])] }),
    ),
    h("div", { class: "fields" },
      field("Note", "note", {}),
      h("label", { class: "field" }, "Receipt (optional, saved to Drive)", h("input", { type: "file", name: "file" })),
    ),
    h("button", { type: "button", class: "primary", onclick: add }, "Record payment"),
    msg,
  );
  async function add() {
    const v = formValues(form);
    try {
      const r = await api(`/api/admin/expenses/${id}/payments`, { method: "POST", body: v });
      const file = form.elements.file.files[0];
      if (file) {
        const upload = new FormData();
        upload.append("file", file);
        upload.append("payment_id", r.payment_id);
        await api(`/api/admin/expenses/${id}/attachments`, { method: "POST", form: upload }).catch((error) => {
          alert(`Payment saved, but the receipt didn't upload: ${error.message}`);
        });
      }
      closeDialog(true);
      openEditor(id);
    } catch (error) {
      setMsg(msg, error.message, "err");
    }
  }
  const list = detail.payments.length
    ? h("div", { class: "list" }, detail.payments.map((p) => h("div", { class: "item" },
        h("b", {}, money(p.amount)), h("span", {}, p.paid_on ? fmtDate(p.paid_on) : "date unknown"),
        p.payer ? h("span", {}, `by ${p.payer}`) : null, p.method ? h("span", { class: "muted" }, p.method) : null,
        p.note ? h("span", { class: "muted" }, p.note) : null, h("span", { class: "spacer" }),
        h("button", { class: "small danger", onclick: async () => {
          if (!confirm("Delete this payment? The stage won't move back on its own.")) return;
          await api(`/api/admin/payments/${p.id}`, { method: "DELETE" });
          closeDialog(true);
          openEditor(id);
        } }, "Delete"))))
    : h("p", { class: "muted", style: "margin:0 0 10px" }, "No payments yet.");
  return h("section", {}, h("h3", {}, `Payments · ${money(detail.expense.paid)} paid, ${money(detail.expense.owed)} owed`), list, h("div", { style: "margin-top:12px" }, form));
}

function attachmentsSection(id, detail) {
  const msg = h("p", { class: "msg" });
  const input = h("input", { type: "file" });
  const list = h("div", { class: "list" }, detail.attachments.length
    ? detail.attachments.map((a) => h("div", { class: "item" }, a.web_link ? h("a", { href: a.web_link, target: "_blank", rel: "noopener" }, a.name) : a.name,
        h("span", { class: "muted" }, fmtDate(a.created_at))))
    : h("span", { class: "muted" }, "No files yet."));
  return h("section", {}, h("h3", {}, "Contracts, quotes and receipts"), list,
    h("div", { class: "row", style: "margin-top:10px" }, input, h("button", { onclick: async () => {
      if (!input.files[0]) return setMsg(msg, "Choose a file first.", "err");
      const form = new FormData();
      form.append("file", input.files[0]);
      setMsg(msg, "Uploading to Google Drive…");
      try {
        const r = await api(`/api/admin/expenses/${id}/attachments`, { method: "POST", form });
        list.prepend(h("div", { class: "item" }, r.attachment.webViewLink ? h("a", { href: r.attachment.webViewLink, target: "_blank", rel: "noopener" }, r.attachment.name) : r.attachment.name));
        setMsg(msg, "Saved to Drive.", "ok");
        input.value = "";
      } catch (error) {
        setMsg(msg, error.message, "err");
      }
    } }, "Upload")), msg);
}

function historySection(detail) {
  return h("section", {}, h("h3", {}, "Price history"),
    h("div", { class: "list" }, [...detail.history].reverse().map((r) => h("div", { class: "item" },
      h("span", { class: "muted" }, fmtDate(r.at)), statusPill(r.status, data.status_labels),
      r.total != null ? h("b", {}, money(r.total)) : null, r.note ? h("span", {}, r.note) : null,
      r.changed_by ? h("span", { class: "muted" }, r.changed_by) : null))));
}

await load();
const hashId = Number(location.hash.slice(1));
if (hashId) openEditor(hashId);
</script>
</body>
</html>
