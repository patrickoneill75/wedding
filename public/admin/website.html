<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<title>Website — Wedding planner</title>
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .live { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-1); margin-bottom: 16px; font-size: 14px; }
  .live.on { border-color: rgba(12, 163, 12, .35); background: rgba(12, 163, 12, .06); }
  .pagelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .pagelist li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; }
  .pagelist code { color: var(--text-muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar"></div>
  <div class="row" style="margin-bottom:6px">
    <div><h1>Website</h1></div>
    <span class="spacer"></span>
    <a class="btn" href="/_new/" target="_blank" rel="noopener">Preview the new site ↗</a>
  </div>
  <p class="sub">Your wedding website, coded to match the Zola site. Its words and photos live in the code: ask Claude to change them.</p>
  <div class="live" id="live"></div>
  <div class="card">
    <h2>Pages</h2>
    <p class="desc">Each opens in the preview. Things to Do shows in the menu once it's published in Settings.</p>
    <ul class="pagelist" id="pages"></ul>
  </div>
</div>

<script type="module">
import { api, initPage, h } from "/admin/admin.js";

await initPage("website.html");
let data = await api("/api/admin/website");

function render() {
  const box = document.getElementById("live");
  box.className = `live${data.live ? " on" : ""}`;
  box.replaceChildren(
    h("span", {}, data.live
      ? h("span", {}, h("b", {}, "Guests see the new website."), " The Zola copy is no longer shown.")
      : h("span", {}, h("b", {}, "Guests still see the Zola copy."), " Check the new site in the preview, then switch when it's ready.")),
    h("span", { class: "spacer" }),
    h("button", { class: data.live ? "" : "primary", onclick: async () => {
      const ok = data.live
        ? confirm("Switch guests back to the copy of your Zola site?")
        : confirm("Switch guests to the new website? It replaces the Zola copy at your website's address. You can switch back any time.");
      if (!ok) return;
      try {
        data = await api("/api/admin/website/settings", { method: "PUT", body: { live: !data.live } });
        render();
      } catch (error) {
        alert(error.message);
      }
    } }, data.live ? "Switch back to the Zola copy" : "Switch guests to the new site"));
  document.getElementById("pages").replaceChildren(...data.pages.map((p) =>
    h("li", {},
      h("b", {}, p.label), h("code", {}, p.path),
      p.shown ? null : h("span", { class: "pill" }, "Hidden until published"),
      h("span", { class: "spacer" }),
      h("a", { class: "btn", href: `/_new${p.path}`, target: "_blank", rel: "noopener" }, "Preview ↗"))));
}
render();
</script>
</body>
</html>
