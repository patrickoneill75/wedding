<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<title>Guests — Wedding planner</title>
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .guest { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 2px 0; }
  .tag { font-size: 11px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; padding: 0 5px; }
  .step { font-size: 11.5px; font-weight: 600; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--border);
          background: var(--wash); color: var(--text-secondary); white-space: nowrap; }
  .step.std, .step.invite { color: var(--accent); border-color: rgba(42, 120, 214, .35); background: rgba(42, 120, 214, .08); }
  .step.yes, .step.gift { color: var(--good); border-color: rgba(12, 163, 12, .3); background: rgba(12, 163, 12, .1); }
  .step.thanks { color: #fff; border-color: #087008; background: #087008; }
  .step.no { color: var(--bad); border-color: rgba(208, 59, 59, .3); background: rgba(208, 59, 59, .08); }
  .bulk .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
  td.c { text-align: center; }
  .bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  .guest-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .guest-card .flags { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .summary { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }
  .summary b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .more { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 18px; padding: 14px 16px;
          border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1); margin-bottom: 12px; }
  .more h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 0 0 6px; }
  .more .group { display: flex; flex-direction: column; gap: 5px; }
  .more .foot { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--text-secondary); }
  #moreBtn.on { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar"></div>
  <div class="row" style="margin-bottom:6px">
    <div><h1>Guests</h1></div>
    <span class="spacer"></span>
    <a class="btn" id="reportBtn" href="/admin/reports.html?r=full-list" hidden>Run a report</a>
    <button class="primary" id="addBtn">+ Add household</button>
  </div>
  <div class="summary" id="summary"></div>

  <div class="filters">
    <input type="search" id="search" placeholder="Search names, cities, notes…">
    <select id="inviteType">
      <option value="">Ceremony and reception</option>
      <option value="ceremony:1">Invited to the ceremony</option>
      <option value="ceremony:0">Not invited to the ceremony</option>
      <option value="reception:1">Invited to the reception</option>
      <option value="reception:0">Not invited to the reception</option>
      <option value="rehearsal:1">Invited to the rehearsal dinner</option>
      <option value="rehearsal:0">Not invited to the rehearsal dinner</option>
    </select>
    <select id="rsvp"><option value="">Any RSVP</option><option value="pending">Awaiting reply</option><option value="yes">Coming</option><option value="no">Not coming</option></select>
    <button id="moreBtn" aria-expanded="false" aria-controls="more">More filters</button>
  </div>
  <div class="more" id="more" hidden></div>

  <div class="bulk" id="bulk" hidden>
    <span id="bulkCount"></span>
    <button class="small" data-field="save_the_date_sent" data-value="1">Mark save-the-date sent</button>
    <button class="small" data-field="invite_sent" data-value="1">Mark invite sent</button>
    <button class="small" data-field="thank_you_sent" data-value="1">Mark thank-you sent</button>
    <span class="sep"></span>
    <button class="small" data-invite="invite_ceremony" data-on="1">Ceremony on</button>
    <button class="small" data-invite="invite_ceremony" data-on="0">Ceremony off</button>
    <button class="small" data-invite="invite_reception" data-on="1">Reception on</button>
    <button class="small" data-invite="invite_reception" data-on="0">Reception off</button>
    <button class="small" data-invite="invite_rehearsal" data-on="1">Rehearsal dinner on</button>
    <button class="small" data-invite="invite_rehearsal" data-on="0">Rehearsal dinner off</button>
    <span class="sep"></span>
    <button class="small" data-invite="out_of_town" data-on="1">Out of town on</button>
    <button class="small" data-invite="out_of_town" data-on="0">Out of town off</button>
    <button class="small" data-invite="international" data-on="1">International on</button>
    <button class="small" data-invite="international" data-on="0">International off</button>
    <span class="sep"></span>
    <button class="small danger" id="resetRsvp">Reset RSVP</button>
    <button class="small link" id="clearSel">Clear selection</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th><input type="checkbox" id="selectAll" title="Select all shown"></th>
        <th>Household</th><th>Guests</th><th class="c">Save the date</th><th class="c">Invite</th><th>Gift</th><th class="c">Thank-you</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { api, canSee, initPage, h, openDialog, field, check, formValues, setMsg, fmtDate } from "/admin/admin.js";

const me = await initPage("guests.html");
document.getElementById("reportBtn").hidden = !canSee(me, "reports");
let data;
const selected = new Set();
/**
 * Where a guest is in the funnel: the furthest step reached, in order save-the-date,
 * invite, RSVP (yes or no), gift received, thank-you sent. The mailing and gift steps are
 * the household's; the RSVP is the guest's own.
 */
function funnelStep(hh, g) {
  if (hh.thank_you_sent) return { key: "thanks", label: "Thank-you sent" };
  if (hh.gift_received) return { key: "gift", label: "Gift received" };
  if (g.rsvp === "yes") return { key: "yes", label: "RSVP yes" };
  if (g.rsvp === "no") return { key: "no", label: "RSVP no" };
  if (hh.invite_sent) return { key: "invite", label: "Invite sent" };
  if (hh.save_the_date_sent) return { key: "std", label: "Save-the-date sent" };
  return { key: "none", label: "Not started" };
}

async function load() {
  data = await api("/api/admin/guests");
  const c = data.counts;
  const item = (n, label) => h("span", {}, h("b", {}, String(n)), ` ${label}`);
  const guests = data.households.flatMap((hh) => hh.guests);
  // Guests matching `test`, plus the plus-ones of those matching `plusOne` (by default, the same test).
  const people = (test, plusOne = test) => guests.filter(test).length + guests.filter((g) => g.plus_one_allowed && plusOne(g)).length;
  document.getElementById("summary").replaceChildren(
    item(c.invited, "invited"), item(c.weighted, "weighted"), item(c.confirmed, "coming"), item(c.declined, "not coming"),
    item(c.pending, "awaiting reply"), item(c.households, "households"), item(c.plus_ones_allowed, "plus-ones offered"),
    item(c.invites.ceremony, "invited to the ceremony"), item(c.invites.reception, "invited to the reception"),
    // Plus-ones count with their guest, as in the Head count report.
    item(people((g) => g.invite_rehearsal), "invited to the rehearsal dinner"),
    item(people((g) => g.invite_rehearsal && g.rehearsal_rsvp === "yes", (g) => g.invite_rehearsal && g.plus_one_rehearsal_rsvp === "yes"), "coming to the rehearsal dinner"),
    item(people((g) => g.out_of_town), "out of town"),
    item(people((g) => g.international), "international"),
  );
  render();
}

/*
 * More filters: every tag as a checkbox. In a group of either/or choices (side,
 * priority) a guest needs any one ticked; every other ticked box must hold too. A
 * household shows when one of its guests matches the guest tags and the household
 * matches the household ones.
 */
const ANY_OF = new Set(["side", "priority", "rehearsal_rsvp"]);
const MORE = [
  ["Side", "side", [["Bride", (g) => g.side === "Bride"], ["Groom", (g) => g.side === "Groom"], ["No side yet", (g) => !g.side]]],
  ["Priority", "priority", [["High", (g) => g.priority === "High"], ["Medium", (g) => g.priority === "Medium"], ["Low", (g) => g.priority === "Low"]]],
  ["Invited to", "invites", [["Ceremony", (g) => g.invite_ceremony], ["Reception", (g) => g.invite_reception], ["Rehearsal dinner", (g) => g.invite_rehearsal]]],
  ["Rehearsal dinner RSVP", "rehearsal_rsvp", [
    ["Coming", (g) => g.invite_rehearsal && g.rehearsal_rsvp === "yes"],
    ["Awaiting reply", (g) => g.invite_rehearsal && g.rehearsal_rsvp === "pending"],
    ["Not coming", (g) => g.invite_rehearsal && g.rehearsal_rsvp === "no"]]],
  ["Family and party", "family", [["Wedding party", (g) => g.wedding_party], ["Immediate family", (g) => g.immediate_family], ["Extended family", (g) => g.extended_family]]],
  ["Travel", "travel", [["Out of town", (g) => g.out_of_town], ["International", (g) => g.international]]],
  ["Plus-ones", "plusone", [["Has a plus-one", (g) => g.plus_one_allowed]]],
];
const HOUSEHOLD_MORE = ["Household", "household", [
  ["Save-the-date not sent", (hh) => !hh.save_the_date_sent],
  ["Invite not sent", (hh) => !hh.invite_sent],
  ["Gift received, no thank-you yet", (hh) => hh.gift_received && !hh.thank_you_sent],
  ["Missing an address", (hh) => !hh.address1],
]];
const ticked = new Set();

function renderMore() {
  const box = document.getElementById("more");
  const group = ([title, key, options]) => h("div", { class: "group" }, h("h3", {}, title),
    options.map(([label]) => h("label", { class: "check" },
      h("input", { type: "checkbox", checked: ticked.has(`${key}:${label}`), onchange: (ev) => {
        ev.target.checked ? ticked.add(`${key}:${label}`) : ticked.delete(`${key}:${label}`);
        updateMoreButton();
        render();
      } }), label)));
  box.replaceChildren(...MORE.map(group), group(HOUSEHOLD_MORE),
    h("div", { class: "foot" }, "Ticked boxes in Side, Priority or Rehearsal dinner RSVP match any of them; every other ticked box must also be true.",
      h("span", { class: "spacer" }),
      h("button", { class: "small", onclick: () => { ticked.clear(); renderMore(); updateMoreButton(); render(); } }, "Clear filters")));
}
function updateMoreButton() {
  const button = document.getElementById("moreBtn");
  button.textContent = ticked.size ? `More filters (${ticked.size})` : "More filters";
  button.classList.toggle("on", ticked.size > 0);
}
function guestPasses(g) {
  return MORE.every(([, key, options]) => {
    const on = options.filter(([label]) => ticked.has(`${key}:${label}`));
    if (!on.length) return true;
    return ANY_OF.has(key) ? on.some(([, test]) => test(g)) : on.every(([, test]) => test(g));
  });
}

function matches(hh) {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const rsvp = document.getElementById("rsvp").value;
  const inviteType = document.getElementById("inviteType").value;
  if (q) {
    const hay = [hh.display_name, hh.greeting, hh.city, hh.state, hh.notes, hh.email, ...hh.guests.flatMap((g) => [g.first_name, g.last_name, g.plus_one_name, g.notes, g.email])]
      .join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  const guestTicks = [...ticked].some((t) => !t.startsWith("household:"));
  if (guestTicks && !hh.guests.some(guestPasses)) return false;
  if (!HOUSEHOLD_MORE[2].every(([label, test]) => !ticked.has(`household:${label}`) || test(hh))) return false;
  if (inviteType) {
    const [event, on] = inviteType.split(":");
    if (!hh.guests.some((g) => Boolean(g[`invite_${event}`]) === (on === "1"))) return false;
  }
  if (rsvp && !hh.guests.some((g) => g.rsvp === rsvp || (g.plus_one_allowed && g.plus_one_rsvp === rsvp))) return false;
  return true;
}

async function toggle(hh, fieldName, value) {
  await api(`/api/admin/households/${hh.id}`, { method: "PUT", body: { [fieldName]: value } });
  hh[fieldName] = value ? 1 : 0;
}

function render() {
  const shown = data.households.filter(matches);
  const rows = shown.map((hh) => {
    const box = (fieldName) => h("td", { class: "c" }, h("input", { type: "checkbox", checked: Boolean(hh[fieldName]),
      // Redrawn after the save, so the funnel pills show the new step.
      onchange: (ev) => toggle(hh, fieldName, ev.target.checked).then(render, (e) => { alert(e.message); ev.target.checked = !ev.target.checked; }) }));
    return h("tr", {},
      h("td", {}, h("input", { type: "checkbox", checked: selected.has(hh.id), onchange: (ev) => { ev.target.checked ? selected.add(hh.id) : selected.delete(hh.id); updateBulk(); } })),
      h("td", {}, h("button", { class: "link", onclick: () => openHousehold(hh) }, hh.display_name || "(no name)"),
        h("div", { class: "muted", style: "font-size:12px" }, [hh.code, [hh.city, hh.state].filter(Boolean).join(", ")].filter(Boolean).join(" · ")),
        hh.rsvp_at ? h("div", { class: "muted", style: "font-size:12px" }, `RSVP'd ${fmtDate(hh.rsvp_at)}`) : null),
      h("td", {}, hh.guests.map((g) => {
        const step = funnelStep(hh, g);
        return h("div", { class: "guest" }, h("span", {}, `${g.first_name} ${g.last_name}`), h("span", { class: `step ${step.key}` }, step.label));
      })),
      box("save_the_date_sent"),
      box("invite_sent"),
      h("td", {}, hh.gift ? hh.gift : h("span", { class: "muted" }, "—"), hh.gift_received ? h("div", { class: "muted", style: "font-size:12px" }, "received") : null),
      box("thank_you_sent"),
    );
  });
  if (!rows.length) rows.push(h("tr", {}, h("td", { colspan: 7, class: "muted" }, data.households.length ? "Nobody matches those filters." : "No guests yet. Import the spreadsheet in Settings, or add a household.")));
  document.getElementById("rows").replaceChildren(...rows);
  updateBulk();
}

function updateBulk() {
  document.getElementById("bulk").hidden = selected.size === 0;
  document.getElementById("bulkCount").textContent = `${selected.size} selected`;
}


for (const id of ["search", "rsvp", "inviteType"]) document.getElementById(id).addEventListener("input", render);
renderMore();
document.getElementById("moreBtn").addEventListener("click", (ev) => {
  const box = document.getElementById("more");
  box.hidden = !box.hidden;
  ev.currentTarget.setAttribute("aria-expanded", String(!box.hidden));
});
document.getElementById("selectAll").addEventListener("change", (ev) => {
  for (const hh of data.households.filter(matches)) ev.target.checked ? selected.add(hh.id) : selected.delete(hh.id);
  render();
});
document.getElementById("clearSel").addEventListener("click", () => { selected.clear(); document.getElementById("selectAll").checked = false; render(); });
/** A bulk action that fails says so, instead of doing nothing. */
const bulk = (fn) => fn().catch((error) => alert(error.message));
for (const button of document.querySelectorAll("#bulk [data-field]")) {
  button.addEventListener("click", () => bulk(async () => {
    await api("/api/admin/households/bulk", { method: "POST", body: { ids: [...selected], field: button.dataset.field, value: true } });
    selected.clear();
    document.getElementById("selectAll").checked = false;
    await load();
  }));
}
for (const button of document.querySelectorAll("#bulk [data-invite]")) {
  button.addEventListener("click", () => bulk(async () => {
    await api("/api/admin/guests/bulk", { method: "POST", body: { household_ids: [...selected], field: button.dataset.invite, value: button.dataset.on === "1" } });
    await load();
  }));
}
document.getElementById("resetRsvp").addEventListener("click", () => {
  if (!confirm(`Reset the RSVP for ${selected.size} household(s)? Everyone goes back to "awaiting reply", and what they filled in (plus-one names, dietary needs, message) is cleared.`)) return;
  bulk(async () => {
    await api("/api/admin/households/reset-rsvp", { method: "POST", body: { ids: [...selected] } });
    selected.clear();
    document.getElementById("selectAll").checked = false;
    await load();
  });
});
document.getElementById("addBtn").addEventListener("click", () => openHousehold(null));

/* ------------------------------------------------------------- household editor -- */

function guestCard(g, onRemove) {
  const card = h("div", { class: "guest-card" });
  const plusOneFields = h("div", { class: "fields" },
    field("Plus-one's name (blank until they RSVP)", "plus_one_name", { value: g.plus_one_name || "" }),
    field("Plus-one RSVP", "plus_one_rsvp", { options: [["pending", "Awaiting"], ["yes", "Coming"], ["no", "Not coming"]], value: g.plus_one_rsvp || "pending" }),
    field("Plus-one dietary needs", "plus_one_dietary", { value: g.plus_one_dietary || "" }),
  );
  const rehearsalField = field("Rehearsal dinner RSVP", "rehearsal_rsvp", { options: [["pending", "Awaiting"], ["yes", "Coming"], ["no", "Not coming"]], value: g.rehearsal_rsvp || "pending" });
  const plusOneDinnerField = field("Plus-one rehearsal dinner RSVP", "plus_one_rehearsal_rsvp", { options: [["pending", "Awaiting"], ["yes", "Coming"], ["no", "Not coming"]], value: g.plus_one_rehearsal_rsvp || "pending" });
  plusOneFields.append(plusOneDinnerField);
  rehearsalField.hidden = plusOneDinnerField.hidden = !g.invite_rehearsal;
  const plusOneBox = check("Allow a plus-one", "plus_one_allowed", g.plus_one_allowed, (ev) => { plusOneFields.hidden = !ev.target.checked; });
  plusOneFields.hidden = !g.plus_one_allowed;
  card.append(
    h("div", { class: "fields" },
      field("First name", "first_name", { value: g.first_name || "" }),
      field("Last name", "last_name", { value: g.last_name || "" }),
      field("Side", "side", { options: [["", "—"], ["Bride", "Bride"], ["Groom", "Groom"]], value: g.side || "" }),
      field("Priority", "priority", { options: [["High", "High"], ["Medium", "Medium"], ["Low", "Low"]], value: g.priority || "High" }),
    ),
    h("div", { class: "flags" },
      check("Invited to the ceremony", "invite_ceremony", g.invite_ceremony),
      check("Invited to the reception", "invite_reception", g.invite_reception ?? 1),
      check("Invited to the rehearsal dinner", "invite_rehearsal", g.invite_rehearsal, (ev) => { rehearsalField.hidden = plusOneDinnerField.hidden = !ev.target.checked; }),
      check("Out of town", "out_of_town", g.out_of_town),
      check("International", "international", g.international),
    ),
    h("div", { class: "flags" },
      check("Wedding party", "wedding_party", g.wedding_party),
      check("Immediate family", "immediate_family", g.immediate_family),
      check("Extended family", "extended_family", g.extended_family),
      plusOneBox,
    ),
    plusOneFields,
    h("div", { class: "fields" },
      field("RSVP", "rsvp", { options: [["pending", "Awaiting"], ["yes", "Coming"], ["no", "Not coming"]], value: g.rsvp || "pending" }),
      rehearsalField,
      field("Dietary needs", "dietary", { value: g.dietary || "" }),
      field("Their own email (optional)", "email", { type: "email", value: g.email || "" }),
      g.seat
        ? h("label", { class: "field" }, "Reception seat", h("a", { href: "/admin/seating.html" }, `Table ${g.seat.table}, seat ${g.seat.seat}`))
        : field("Table", "table_name", { value: g.table_name || "" }),
      field("Notes", "notes", { value: g.notes || "" }),
    ),
    h("button", { type: "button", class: "small danger", onclick: () => onRemove(card) }, "Remove guest"),
  );
  card.guestId = g.id || null;
  return card;
}

function cardValues(card) {
  const out = {};
  for (const el of card.querySelectorAll("input, select, textarea")) {
    if (!el.name) continue;
    out[el.name] = el.type === "checkbox" ? el.checked : el.value;
  }
  return out;
}

/** The fields whose values changed since `before`. */
const changes = (now, before) => Object.fromEntries(Object.entries(now).filter(([k, v]) => !before || before[k] !== v));

async function openHousehold(hh) {
  // Open the household as it is now (a guest may have RSVP'd since this page loaded).
  if (hh) {
    await load();
    hh = data.households.find((x) => x.id === hh.id) || hh;
  }
  const changed = await openDialog(hh ? hh.display_name || "Household" : "New household", (close) => {
    const msg = h("p", { class: "msg" });
    const removed = [];
    const guestList = h("div", {});
    // Saving sends only what was changed here, so it can't put back an answer from
    // before an RSVP that arrived while the editor was open.
    const addGuest = (g) => {
      const card = guestCard(g, (c) => { if (c.guestId) removed.push(c.guestId); c.remove(); });
      card.initial = card.guestId ? cardValues(card) : null;
      guestList.append(card);
    };
    (hh?.guests?.length ? hh.guests : [{ priority: "High" }]).forEach(addGuest);

    const form = h("form", { onsubmit: (ev) => ev.preventDefault() },
      h("div", { class: "fields" },
        field("Name on the envelope", "display_name", { value: hh?.display_name || "", placeholder: "Jane and John Smith" }),
        field("Greeting", "greeting", { value: hh?.greeting || "", placeholder: "Jane and John" }),
        field("Email", "email", { type: "email", value: hh?.email || "" }),
        field("Phone", "phone", { value: hh?.phone || "" }),
      ),
      h("div", { class: "fields" },
        field("Address", "address1", { value: hh?.address1 || "" }),
        field("Address line 2", "address2", { value: hh?.address2 || "" }),
        field("City", "city", { value: hh?.city || "" }),
        field("State", "state", { value: hh?.state || "" }),
        field("ZIP", "zip", { value: hh?.zip || "" }),
        field("Country", "country", { value: hh?.country || "" }),
      ),
      h("div", { class: "row", style: "gap:18px; margin-bottom:12px" },
        check("Save-the-date sent", "save_the_date_sent", hh?.save_the_date_sent),
        check("Invite sent", "invite_sent", hh?.invite_sent),
        check("Gift received", "gift_received", hh?.gift_received),
        check("Thank-you sent", "thank_you_sent", hh?.thank_you_sent),
      ),
      h("div", { class: "fields" },
        field("Gift", "gift", { value: hh?.gift || "" }),
        field("Household notes", "notes", { value: hh?.notes || "" }),
      ),
      hh?.rsvp_message ? h("p", { class: "desc" }, `Message with their RSVP: “${hh.rsvp_message}”`) : null,
    );
    let householdBefore = hh ? formValues(form) : null;

    // Remembered across tries: if a save fails partway (a bad email on the third guest),
    // saving again updates what the first try created instead of adding it twice.
    let householdId = hh?.id;
    async function save() {
      const household = formValues(form);
      // A new card left blank adds nobody.
      const cards = [...guestList.children].filter((card) => {
        const v = cardValues(card);
        return card.guestId || String(v.first_name || "").trim() || String(v.last_name || "").trim();
      });
      try {
        if (householdId) {
          const edits = changes(household, householdBefore);
          if (Object.keys(edits).length) await api(`/api/admin/households/${householdId}`, { method: "PUT", body: edits });
        } else householdId = (await api("/api/admin/households", { method: "POST", body: household })).id;
        householdBefore = household;
        while (removed.length) {
          await api(`/api/admin/guests/${removed[0]}`, { method: "DELETE" });
          removed.shift();
        }
        for (const card of cards) {
          const g = cardValues(card);
          if (card.guestId) {
            const edits = changes(g, card.initial);
            if (Object.keys(edits).length) await api(`/api/admin/guests/${card.guestId}`, { method: "PUT", body: edits });
          } else card.guestId = (await api("/api/admin/guests", { method: "POST", body: { ...g, household_id: householdId } })).id;
          card.initial = g;
        }
        close(true);
      } catch (error) {
        setMsg(msg, error.message, "err");
      }
    }

    return h("div", {}, form,
      h("section", {}, h("h3", {}, "Guests in this household"), guestList,
        h("button", { type: "button", class: "small", onclick: () => addGuest({ priority: "High", side: hh?.guests?.[0]?.side || "",
          out_of_town: hh?.guests?.[0]?.out_of_town, international: hh?.guests?.[0]?.international }) }, "+ Add a guest")),
      h("div", { class: "row", style: "margin-top:16px" },
        h("button", { class: "primary", onclick: save }, hh ? "Save" : "Add household"),
        hh && (hh.rsvp_at || hh.guests.some((g) => g.rsvp !== "pending" || (g.invite_rehearsal && g.rehearsal_rsvp !== "pending") || (g.plus_one_allowed && g.plus_one_rsvp !== "pending")))
          ? h("button", { onclick: async () => {
              if (!confirm(`Reset ${hh.display_name}'s RSVP? Everyone goes back to "awaiting reply", and what they filled in (plus-one names, dietary needs, message) is cleared so they can answer again.`)) return;
              await api("/api/admin/households/reset-rsvp", { method: "POST", body: { ids: [hh.id] } });
              close(true);
            } }, "Reset RSVP") : null,
        hh ? h("button", { class: "danger", onclick: async () => {
          if (!confirm(`Delete ${hh.display_name} and everyone in it?`)) return;
          await api(`/api/admin/households/${hh.id}`, { method: "DELETE" });
          close(true);
        } }, "Delete household") : null),
      msg);
  });
  if (changed) await load();
}

await load();
</script>
</body>
</html>
