<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg">
<title>RSVP</title>
<style>
  :root {
    color-scheme: light;
    --page: #f7f4ee; --card: #fffdf9; --ink: #1f1c18; --soft: #5f5850; --muted: #948b80;
    --line: rgba(31, 28, 24, 0.12); --accent: #5b6b4f; --accent-ink: #fff; --bad: #b3261e; --good: #2f6b2f;
    --wash: rgba(31, 28, 24, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #151412; --card: #1e1c19; --ink: #f2eee7; --soft: #c9c1b5; --muted: #8f877c;
      --line: rgba(255, 255, 255, 0.12); --accent: #9db38c; --accent-ink: #151412; --bad: #f2b8b5; --good: #a6d49b;
      --wash: rgba(255, 255, 255, 0.05);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 620px; margin: 0 auto; padding: 56px 16px 80px; }
  header { text-align: center; margin-bottom: 32px; }
  .eyebrow { letter-spacing: .22em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
  h1 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 400; font-size: clamp(34px, 8vw, 52px);
       line-height: 1.1; margin: 10px 0 12px; }
  .when { color: var(--soft); }
  .intro { color: var(--soft); margin-top: 14px; white-space: pre-line; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  h2 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 6px; }
  p.help { color: var(--soft); margin: 0 0 18px; font-size: 15px; }
  label { display: block; font-size: 14px; color: var(--soft); margin-bottom: 14px; }
  input[type="text"], input[type="email"], textarea { display: block; width: 100%; margin-top: 5px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 80px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
  button { font: inherit; border-radius: 999px; border: 1px solid var(--line); padding: 11px 22px; cursor: pointer; background: var(--card); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: .55; cursor: wait; }
  .msg { min-height: 1.4em; margin: 12px 0 0; font-size: 14px; color: var(--bad); }
  .person { border-top: 1px solid var(--line); padding: 18px 0 4px; }
  .person:first-of-type { border-top: 0; padding-top: 4px; }
  .person .name { font-weight: 600; margin-bottom: 10px; }
  .choice { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .choice label { margin: 0; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice span { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer; color: var(--ink); }
  .choice input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .choice input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .plus { background: var(--wash); border-radius: 12px; padding: 14px 14px 2px; margin: 4px 0 12px; }
  .combo { position: relative; }
  .combo input { font-size: 17px; padding: 12px 14px; }
  .suggest { position: absolute; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 6px; list-style: none; z-index: 5;
             background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
             max-height: 340px; overflow-y: auto; }
  .suggest li { padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--ink); }
  .suggest li b { font-weight: 700; }
  .suggest li[aria-selected="true"], .suggest li:hover { background: var(--wash); }
  .suggest li.note { color: var(--soft); cursor: default; font-size: 14px; }
  .suggest li.note:hover { background: none; }
  .done { text-align: center; }
  .done ul { list-style: none; padding: 0; margin: 14px 0 20px; color: var(--soft); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Kindly reply</div>
    <h1 id="names">We're getting married</h1>
    <div class="when" id="when"></div>
    <div class="intro" id="intro"></div>
  </header>

  <form class="card" id="lookup">
    <h2>Find your invitation</h2>
    <p class="help" id="lookupHelp">Start typing your first or last name, then pick yourself from the list.</p>
    <div class="combo">
      <label for="nameSearch" style="margin-bottom:0">Your name</label>
      <input type="text" id="nameSearch" autocomplete="off" autocapitalize="words" spellcheck="false"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="nameList" placeholder="e.g. Conor">
      <ul class="suggest" id="nameList" role="listbox" hidden></ul>
    </div>
    <p class="msg" id="lookupMsg"></p>
  </form>

  <form class="card" id="reply" hidden>
    <h2 id="greeting"></h2>
    <p class="help" id="replyHelp">Let us know who's coming.</p>
    <div id="people"></div>
    <label>Email, for updates (optional) <input type="email" name="email" autocomplete="email"></label>
    <label>A note for us (optional) <textarea name="message"></textarea></label>
    <button class="primary" type="submit">Send RSVP</button>
    <button type="button" class="back">Not you?</button>
    <p class="msg" id="replyMsg"></p>
  </form>

  <div class="card done" id="done" hidden>
    <h2>Thank you!</h2>
    <p class="help" id="doneText"></p>
    <ul id="doneList"></ul>
    <button type="button" id="edit">Change our answers</button>
  </div>

  <div class="card" id="closed" hidden>
    <h2>RSVPs are closed</h2>
    <p class="help">Please get in touch with us directly.</p>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const cards = ["lookup", "reply", "done", "closed"];
const show = (id) => cards.forEach((c) => { $(c).hidden = c !== id; });
let current = null;

const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (k in node && typeof v !== "string") node[k] = v;
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c instanceof Node ? c : document.createTextNode(c));
  return node;
};

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({ error: "Something went wrong. Please try again." }));
  if (!r.ok) throw new Error(data.error || "Something went wrong. Please try again.");
  return data;
}

function fmtDate(iso) {
  if (!iso) return "";
  return new Date(`${iso}T12:00:00`).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}

fetch("/api/public/info").then((r) => r.json()).then((info) => {
  if (info.couple_names) {
    $("names").textContent = info.couple_names;
    document.title = `RSVP · ${info.couple_names}`;
  }
  $("when").textContent = [fmtDate(info.wedding_date), info.venue].filter(Boolean).join(" · ");
  $("intro").textContent = info.rsvp_intro || "";
  if (info.rsvp_deadline) $("lookupHelp").textContent += ` Please reply by ${fmtDate(info.rsvp_deadline)}.`;
  if (!info.rsvp_open) show("closed");
}).catch(() => {});

/* ---- name search: type part of a first or last name, pick from the list ---- */
const search = $("nameSearch");
const list = $("nameList");
let options = [];
let active = -1;
let searchSeq = 0;
let searchTimer = null;
const letters = (text) => text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]/g, "");

function closeList() {
  list.hidden = true;
  search.setAttribute("aria-expanded", "false");
  search.removeAttribute("aria-activedescendant");
}

/** Bold the start of each name word the guest's typing matched. */
function highlighted(name, typed) {
  const words = typed.split(/[\s-]+/).map(letters).filter(Boolean);
  return name.split(/(\s+|-)/).map((part) => {
    const norm = letters(part);
    const hit = words.find((w) => norm.startsWith(w));
    if (!hit) return part;
    // Walk the raw characters until the matched letters are covered (skips apostrophes).
    let seen = 0, cut = 0;
    while (cut < part.length && seen < hit.length) {
      if (letters(part[cut])) seen++;
      cut++;
    }
    return el("span", {}, el("b", {}, part.slice(0, cut)), part.slice(cut));
  });
}

function renderList() {
  if (!options.length) {
    list.replaceChildren(el("li", { class: "note" }, "We can't find that name. Try how it's written on your invitation, or contact us."));
  } else {
    list.replaceChildren(...options.map((o, i) => el("li", {
      id: `name-opt-${i}`, role: "option", "aria-selected": i === active ? "true" : "false",
      // mousedown, not click, so the input doesn't lose focus and close the list first.
      onmousedown: (e) => { e.preventDefault(); pick(i); },
    }, ...highlighted(o.name, search.value))));
  }
  list.hidden = false;
  search.setAttribute("aria-expanded", "true");
  if (active >= 0) search.setAttribute("aria-activedescendant", `name-opt-${active}`);
}

async function runSearch() {
  const q = search.value;
  const mine = ++searchSeq;
  try {
    const { results } = await post("/api/public/rsvp/search", { q });
    if (mine !== searchSeq) return; // a newer keystroke already searched
    options = results;
    active = results.length ? 0 : -1;
    renderList();
  } catch (error) {
    if (mine === searchSeq) $("lookupMsg").textContent = error.message;
  }
}

search.addEventListener("input", () => {
  $("lookupMsg").textContent = "";
  clearTimeout(searchTimer);
  if (letters(search.value).length < 2) {
    searchSeq++;
    options = [];
    closeList();
    return;
  }
  searchTimer = setTimeout(runSearch, 180);
});
search.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!options.length) return;
    e.preventDefault();
    active = (active + (e.key === "ArrowDown" ? 1 : -1) + options.length) % options.length;
    renderList();
    list.children[active]?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (active >= 0) pick(active);
  } else if (e.key === "Escape") {
    closeList();
  }
});
search.addEventListener("blur", () => setTimeout(closeList, 120));
search.addEventListener("focus", () => { if (options.length) renderList(); });
$("lookup").addEventListener("submit", (ev) => ev.preventDefault());

async function pick(i) {
  const choice = options[i];
  if (!choice) return;
  search.value = choice.name;
  closeList();
  $("lookupMsg").textContent = "";
  search.disabled = true;
  try {
    const { matches } = await post("/api/public/rsvp/lookup", { pick: choice.pick });
    openReply(matches[0]);
  } catch (error) {
    $("lookupMsg").textContent = error.message;
  } finally {
    search.disabled = false;
  }
}

for (const b of document.querySelectorAll(".back")) {
  b.addEventListener("click", () => {
    search.value = "";
    options = [];
    show("lookup");
    search.focus();
  });
}

function choice(name, value, current) {
  return el("div", { class: "choice", role: "radiogroup" },
    el("label", {}, el("input", { type: "radio", name, value: "yes", checked: current === "yes", required: true }), el("span", {}, value[0])),
    el("label", {}, el("input", { type: "radio", name, value: "no", checked: current === "no" }), el("span", {}, value[1])));
}

function openReply(household) {
  current = household;
  $("greeting").textContent = `Hi ${household.greeting}!`;
  $("replyHelp").textContent = household.responded ? "You've already replied. Change anything below and send it again." : "Let us know who's coming.";
  const form = $("reply");
  form.email.value = household.email || "";
  form.message.value = household.message || "";
  $("people").replaceChildren(...household.guests.map((g) => {
    const box = el("div", { class: "person" },
      el("div", { class: "name" }, `${g.first_name} ${g.last_name}`),
      choice(`rsvp_${g.id}`, ["Joyfully accepts", "Regretfully declines"], g.rsvp),
      el("label", {}, "Dietary needs (optional)", el("input", { type: "text", name: `dietary_${g.id}`, value: g.dietary || "" })));
    if (g.plus_one_allowed) {
      const details = el("div", {},
        el("label", {}, "Guest's name", el("input", { type: "text", name: `plus_name_${g.id}`, value: g.plus_one_name || "" })),
        el("label", {}, "Their dietary needs (optional)", el("input", { type: "text", name: `plus_dietary_${g.id}`, value: g.plus_one_dietary || "" })));
      const plus = el("div", { class: "plus" },
        el("div", { style: "font-size:14px;color:var(--soft);margin-bottom:8px" }, `${g.first_name}, you're welcome to bring a guest.`),
        choice(`plus_${g.id}`, ["Bringing a guest", "Coming alone"], g.plus_one_rsvp === "yes" ? "yes" : g.plus_one_rsvp === "no" ? "no" : null),
        details);
      const sync = () => {
        const coming = form.querySelector(`input[name="rsvp_${g.id}"]:checked`)?.value === "yes";
        const bringing = form.querySelector(`input[name="plus_${g.id}"]:checked`)?.value === "yes";
        plus.hidden = !coming;
        details.hidden = !bringing;
        for (const r of plus.querySelectorAll(`input[name="plus_${g.id}"]`)) r.required = coming;
        form.querySelector(`[name="plus_name_${g.id}"]`).required = coming && bringing;
      };
      box.addEventListener("change", sync);
      box.append(plus);
      queueMicrotask(sync);
    }
    return box;
  }));
  show("reply");
}

$("reply").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const form = ev.target;
  const value = (name) => form.querySelector(`[name="${name}"]`);
  const picked = (name) => form.querySelector(`input[name="${name}"]:checked`)?.value;
  const guests = current.guests.map((g) => ({
    id: g.id,
    rsvp: picked(`rsvp_${g.id}`),
    dietary: value(`dietary_${g.id}`).value,
    ...(g.plus_one_allowed ? {
      plus_one_rsvp: picked(`plus_${g.id}`) || "no",
      plus_one_name: value(`plus_name_${g.id}`).value,
      plus_one_dietary: value(`plus_dietary_${g.id}`).value,
    } : {}),
  }));
  const button = form.querySelector("button.primary");
  button.disabled = true;
  $("replyMsg").textContent = "";
  try {
    const { household } = await post("/api/public/rsvp/submit", { token: current.token, guests, email: form.email.value, message: form.message.value });
    current = { ...household, token: current.token };
    const coming = household.guests.filter((g) => g.rsvp === "yes");
    $("doneText").textContent = coming.length ? "We can't wait to celebrate with you." : "We'll miss you, and thank you for letting us know.";
    $("doneList").replaceChildren(...household.guests.flatMap((g) => [
      el("li", {}, `${g.first_name} ${g.last_name}: ${g.rsvp === "yes" ? "attending" : "not attending"}`),
      g.plus_one_allowed && g.plus_one_rsvp === "yes" ? el("li", {}, `${g.plus_one_name}: attending`) : null,
    ].filter(Boolean)));
    show("done");
  } catch (error) {
    $("replyMsg").textContent = error.message;
  } finally {
    button.disabled = false;
  }
});
$("edit").addEventListener("click", () => openReply(current));
</script>
</body>
</html>
