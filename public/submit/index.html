<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg">
<title>Add an expense</title>
<link rel="stylesheet" href="/admin/admin.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .shell { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 620px; margin: 0 auto; min-height: 0;
           padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 16px 10px; }
  .head h1 { margin: 0; font-size: 20px; }
  .who { margin-left: auto; font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .who select { width: auto; padding: 4px 8px; }
  .thread { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-block: 6px 16px; min-height: 0; }
  .msg-row { display: flex; }
  .msg-row.me { justify-content: flex-end; }
  .bubble { max-width: 86%; padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .them .bubble { background: var(--surface-2); border-bottom-left-radius: 5px; }
  .me .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
  .bubble img { display: block; max-width: 180px; max-height: 220px; border-radius: 10px; margin-bottom: 6px; }
  .bubble.thinking { color: var(--text-muted); font-style: italic; }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; }
  .starters button { border-radius: 999px; font-size: 13.5px; }
  .card { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; background: var(--surface-1); max-width: 92%; }
  .card h3 { margin: 0 0 8px; font-size: 14px; }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; font-size: 14px; }
  .card dt { color: var(--text-muted); }
  .card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .card.saved { border-color: var(--good); }
  .composer { border-top: 1px solid var(--border); padding-block: 10px max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; background: var(--page); }
  .attached { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
  .attached img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }
  .bar { display: flex; gap: 8px; align-items: flex-end; }
  .bar textarea { flex: 1; min-height: 44px; max-height: 140px; resize: none; font-size: 16px; padding: 10px 12px; border-radius: 12px; }
  .bar button { height: 44px; }
  .icon-btn { width: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 22px; height: 22px; }
  .foot { font-size: 12.5px; color: var(--text-muted); text-align: center; }
  .foot a { color: inherit; }
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <h1>Add an expense</h1>
    <label class="who" id="whoWrap" hidden>I'm <select id="who"></select></label>
  </div>
  <p class="msg err" id="fatal"></p>
  <div class="thread" id="thread" aria-live="polite"></div>
  <form class="composer" id="composer" hidden>
    <div class="attached" id="attached" hidden></div>
    <div class="bar">
      <button type="button" class="icon-btn" id="attach" aria-label="Add a receipt photo or PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <input type="file" id="file" accept="image/*,application/pdf" hidden>
      <textarea id="text" rows="1" placeholder="What did you spend on?" autocomplete="off" enterkeyhint="send"></textarea>
      <button type="submit" class="primary" id="send">Send</button>
    </div>
    <div class="foot">Rather fill in a form? <a id="formLink" href="form.html">Use the plain form</a>.</div>
  </form>
</div>

<script>
// Signed out (or signed in as someone not on the list): sign in, then come back here.
const toSignIn = () => { location.href = `/admin/login.html?next=${encodeURIComponent(location.pathname)}`; };
const $ = (id) => document.getElementById(id);
const thread = $("thread");
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const recall = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "class") n.className = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));
  return n;
}

// The conversation as the API sees it (sent back each turn, unchanged), the receipt to
// save with the entry, and the proposal on screen, if any.
let messages = [];
let receipt = null;      // { file, block, preview }
let pending = null;      // the receipt picked but not sent yet
let proposal = null;
let savedCall = null;    // the proposal just saved, answered with the next message
let busy = false;

function say(role, text, image) {
  const row = el("div", { class: `msg-row ${role}` }, el("div", { class: "bubble" }, image ? el("img", { src: image, alt: "Receipt" }) : null, text || null));
  thread.append(row);
  row.scrollIntoView({ block: "end" });
  return row;
}

function start() {
  messages = [];
  receipt = pending = proposal = savedCall = null;
  thread.replaceChildren();
  say("them", "What did you spend on? Tell me in a sentence, like “paid the florist a $500 deposit”, or add a photo of the receipt with the camera button.");
  const row = el("div", { class: "msg-row them" }, el("div", { class: "starters" },
    el("button", { type: "button", onclick: () => $("file").click() }, "Add a receipt"),
    el("button", { type: "button", onclick: () => { $("text").value = "We got a quote for "; $("text").focus(); } }, "Log a quote"),
    el("button", { type: "button", onclick: () => { $("text").value = "We paid a deposit to "; $("text").focus(); } }, "Log a deposit"),
  ));
  thread.append(row);
  showAttached();
}

/* --------------------------------------------------------------- receipts -- */

// Photos are shrunk before they're sent: Claude reads a 1568px image as well as a full
// one, and a phone photo would make every turn slow.
async function toBlock(file) {
  if (file.type === "application/pdf") {
    if (file.size > 8 * 1024 * 1024) throw new Error("That PDF is over 8 MB. Try a photo of it instead.");
    const data = await readBase64(file);
    return { block: { type: "document", source: { type: "base64", media_type: "application/pdf", data } }, preview: null };
  }
  const bitmap = await createImageBitmap(file).catch(() => { throw new Error("Couldn't read that image. Try a JPEG or PNG."); });
  const scale = Math.min(1, 1568 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const url = canvas.toDataURL("image/jpeg", 0.85);
  return { block: { type: "image", source: { type: "base64", media_type: "image/jpeg", data: url.split(",")[1] } }, preview: url };
}
function readBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1]);
    r.onerror = () => reject(new Error("Couldn't read that file."));
    r.readAsDataURL(file);
  });
}

function showAttached() {
  const box = $("attached");
  box.hidden = !pending;
  if (!pending) return box.replaceChildren();
  box.replaceChildren(
    pending.preview ? el("img", { src: pending.preview, alt: "" }) : null,
    el("span", {}, pending.file.name || "Receipt"),
    el("button", { type: "button", class: "small", onclick: () => { pending = null; showAttached(); } }, "Remove"),
  );
}

$("attach").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async () => {
  const file = $("file").files[0];
  $("file").value = "";
  if (!file) return;
  try {
    pending = { file, ...(await toBlock(file)) };
    showAttached();
    $("text").focus();
  } catch (error) {
    say("them", error.message);
  }
});

/* ----------------------------------------------------------- conversation -- */

async function send(text) {
  if (busy) return;
  text = text.trim();
  if (!text && !pending) return;
  busy = true;
  $("send").disabled = true;
  const content = [];
  // A reply to a proposal instead of saving it answers that proposal first.
  if (savedCall) {
    content.push({ type: "tool_result", tool_use_id: savedCall.id, content: `Saved as #${savedCall.expense_id}.` });
    savedCall = null;
  }
  if (proposal) {
    content.push({ type: "tool_result", tool_use_id: proposal.tool_use_id, content: "Not saved. They replied instead:" });
    proposal.card.remove();
    proposal = null;
  }
  if (pending) {
    content.push(pending.block);
    receipt = pending;
  }
  content.push({ type: "text", text: text || "Here's the receipt." });
  const shown = pending && !pending.preview ? [text, `Receipt: ${pending.file.name}`].filter(Boolean).join("\n") : text;
  say("me", shown, pending?.preview);
  pending = null;
  showAttached();
  messages.push({ role: "user", content });
  // The reply streams in: "Thinking…" until the first words, then the words as they come.
  let bubble = say("them", "Thinking…");
  bubble.firstChild.classList.add("thinking");
  let written = "";
  const write = (text) => {
    if (!written) bubble.firstChild.classList.remove("thinking");
    written += text;
    bubble.firstChild.textContent = written.trimStart();
    bubble.scrollIntoView({ block: "end" });
  };
  let done = null;
  try {
    const r = await fetch("/api/public/expense/chat", {
      method: "POST",
      headers: { "content-type": "application/json", "x-wedding": "1" },
      body: JSON.stringify({ who: $("who").value, today: localToday(), messages }),
    });
    if (r.status === 401) return toSignIn();
    if (!r.ok || !(r.headers.get("content-type") || "").includes("ndjson")) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.error || "Something went wrong. Try again.");
    }
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done: end } = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), { stream: !end });
      const lines = buffer.split("\n");
      buffer = end ? "" : lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        if (event.type === "text") write(event.text);
        else if (event.type === "break" && written) {
          bubble = say("them", "");
          written = "";
        } else if (event.type === "done") done = event;
        else if (event.type === "error") throw new Error(event.error);
      }
      if (end) break;
    }
    if (!done) throw new Error("The answer was cut off. Send it again.");
    messages = done.messages;
    // Claude may have said nothing (just the proposal), or its text was replaced.
    if (!written && done.reply) write(done.reply);
    if (!bubble.firstChild.textContent) bubble.remove();
    if (done.proposal) showProposal(done.proposal);
  } catch (error) {
    if (!written) bubble.remove();
    messages.pop();
    say("them", error instanceof TypeError ? "Couldn't reach the server. Check your connection and send it again." : error.message);
  } finally {
    busy = false;
    $("send").disabled = false;
  }
}

function showProposal(p) {
  const msg = el("p", { class: "msg" });
  const save = el("button", { type: "button", class: "primary", onclick: () => saveProposal(p, save, msg) }, "Save");
  const card = el("div", { class: "card" },
    el("h3", {}, "Ready to save"),
    el("dl", {}, p.summary.flatMap(([label, value]) => [el("dt", {}, label), el("dd", {}, value)])),
    receipt ? el("p", { class: "desc", style: "margin:0 0 10px" }, "The receipt is saved to Google Drive with it.") : null,
    el("div", { class: "row" }, save, el("button", { type: "button", onclick: () => $("text").focus() }, "Change something")),
    msg,
  );
  const row = el("div", { class: "msg-row them" }, card);
  thread.append(row);
  row.scrollIntoView({ block: "end" });
  proposal = { ...p, card: row };
}

async function saveProposal(p, button, msg) {
  button.disabled = true;
  msg.className = "msg";
  msg.textContent = receipt ? "Saving and uploading the receipt…" : "Saving…";
  const data = new FormData();
  data.append("submitted_by", $("who").value);
  for (const [k, v] of Object.entries(p.form)) if (v !== "") data.append(k, v);
  // Whoever is filling this in paid, unless Claude was told otherwise.
  if (!p.form.payer && (p.form.status === "paid" || p.form.payment_amount)) data.set("payer", $("who").value);
  if (!p.form.paid_on && (p.form.status === "paid" || p.form.payment_amount)) data.set("paid_on", localToday());
  if (receipt) data.append("file", receipt.file);
  try {
    const r = await fetch("/api/public/expense", { method: "POST", body: data, headers: { "x-wedding": "1" } });
    if (r.status === 401) return toSignIn();
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || "Couldn't save.");
    remember("expense-form-who", $("who").value);
    proposal = null;
    savedCall = { id: p.tool_use_id, expense_id: body.expense_id };
    const card = button.closest(".card");
    card.classList.add("saved");
    card.replaceChildren(
      el("h3", {}, "Saved"),
      el("dl", {}, p.summary.flatMap(([label, value]) => [el("dt", {}, label), el("dd", {}, value)])),
      // Spread and filtered: replaceChildren() prints a null as the text "null".
      ...[body.receipt_error ? el("p", { class: "msg err" }, body.receipt_error) : body.receipt ? el("p", { class: "desc" }, `Receipt saved to Drive as ${body.receipt}.`) : null].filter(Boolean),
      el("p", { class: "desc", style: "margin:0 0 10px" }, "Something else, or a change to this one? Just say so."),
      el("div", { class: "row" }, el("button", { type: "button", class: "primary", onclick: start }, "Start a new one")),
    );
  } catch (error) {
    button.disabled = false;
    msg.className = "msg err";
    msg.textContent = error.message;
  }
}

$("composer").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = $("text").value;
  $("text").value = "";
  autosize();
  send(text);
});
$("text").addEventListener("keydown", (ev) => {
  // Enter sends, on phones too; Shift+Enter starts a new line.
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    $("composer").requestSubmit();
  }
});
function autosize() { const t = $("text"); t.style.height = "auto"; t.style.height = `${Math.min(t.scrollHeight, 140)}px`; }
$("text").addEventListener("input", autosize);

async function load() {
  const r = await fetch("/api/public/expense/options");
  if (r.status === 401) return toSignIn();
  const options = await r.json().catch(() => ({}));
  if (!r.ok) {
    $("fatal").textContent = options.error || "This form isn't available.";
    return;
  }
  // Whoever is signed in, unless they've picked someone else on this phone before.
  const who = options.me || recall("expense-form-who");
  $("who").replaceChildren(...options.payers.map((p) => el("option", { value: p, selected: p === who }, p)));
  $("whoWrap").hidden = false;
  $("composer").hidden = false;
  start();
}
load().catch(() => { $("fatal").textContent = "Couldn't load the form. Check your connection and try again."; });
</script>
</body>
</html>
