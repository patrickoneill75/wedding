<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg">
<title>Add an expense</title>
<link rel="stylesheet" href="/admin/admin.css">
<style>
  .wrap { max-width: 560px; }
  .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .head h1 { margin: 0; }
  .who { margin-left: auto; font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .who select { width: auto; padding: 4px 8px; }
  .big input { font-size: 17px; padding: 11px 13px; }
  .chosen { display: flex; gap: 10px; align-items: center; background: var(--wash); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .chosen b { font-size: 15px; }
  .chosen .muted { font-size: 12.5px; margin-top: 2px; }
  .chosen button { margin-left: auto; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .seg button { border: 0; border-radius: 0; padding: 9px 8px; background: var(--surface-1); color: var(--text-secondary); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  .block { margin-bottom: 14px; }
  .block > .label { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; display: block; }
  .paybox { background: var(--wash); border-radius: 10px; padding: 12px; margin-bottom: 14px; }
  .paybox .fields { margin-bottom: 0; }
  .paybox p { margin: 0 0 10px; font-size: 13px; color: var(--text-secondary); }
  details.more { margin-bottom: 14px; font-size: 13px; }
  details.more summary { cursor: pointer; color: var(--text-secondary); margin-bottom: 10px; }
  .done { text-align: center; padding: 30px 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Add an expense</h1>
    <a class="small" id="chatLink" href="./" style="font-size:13px">Just tell Claude instead</a>
    <label class="who" id="whoWrap" hidden>I'm <select name="submitted_by" id="who" form="form"></select></label>
  </div>

  <p class="msg err" id="fatal"></p>

  <form class="card" id="form" hidden>
    <input type="hidden" name="expense_id" id="expenseId">
    <input type="hidden" name="mode" id="mode">

    <label class="field big block" id="searchLabel">What's it for?
      <input id="itemSearch" placeholder="Start typing: flowers, venue, DJ…" autocapitalize="sentences">
    </label>
    <div class="chosen" id="chosen" hidden>
      <div><b id="chosenName"></b><div class="muted" id="chosenInfo"></div></div>
      <button type="button" class="small" id="change">Change</button>
    </div>

    <div id="details" hidden>
      <!-- An item that isn't split into line items: pay or update it, or start splitting it. -->
      <div class="seg" id="modes" hidden>
        <button type="button" data-mode="purchase">Add a line item</button>
        <button type="button" data-mode="update">Pay or update it</button>
      </div>
      <p class="desc" id="modeNote" hidden></p>

      <div class="fields">
        <label class="field" id="itemLabel"><span>Name</span><input name="item"></label>
        <label class="field" id="catLabel">Category<input id="catSearch" placeholder="Type to find one, or a new one"></label>
      </div>
      <div class="fields">
        <label class="field">Vendor<input name="vendor" id="vendor" placeholder="Type to find one, or a new one"></label>
      </div>

      <div class="block">
        <span class="label">Stage</span>
        <div class="chips" id="stages"></div>
      </div>

      <div class="fields">
        <label class="field" id="priceLabel"><span>Price ($)</span><input name="price" type="number" step="0.01" inputmode="decimal"></label>
        <label class="field" id="dueLabel">Next payment due<input name="due_date" type="date"></label>
      </div>

      <div class="paybox">
        <p id="payNote"></p>
        <div class="fields">
          <label class="field" id="amountLabel">Amount paid ($)<input name="payment_amount" type="number" step="0.01" inputmode="decimal" placeholder="Nothing yet"></label>
          <label class="field paid-only">Date paid<input name="paid_on" type="date" id="paidOn"></label>
          <label class="field paid-only">Paid by<select name="payer" id="payer"></select></label>
          <label class="field paid-only">Method<select name="method" id="method"></select></label>
        </div>
      </div>

      <label class="field block">Receipt, quote or contract (optional)
        <input type="file" name="file" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx">
      </label>

      <details class="more" id="more">
        <summary>More: quantity, tax, gratuity, notes</summary>
        <div class="fields" id="mathFields">
          <label class="field">Quantity<input name="units" type="number" step="any" value="1"></label>
          <label class="field">Gratuity %<input name="gratuity_percent" type="number" step="any" value="0"></label>
          <label class="check" style="align-self:end; padding-bottom:8px"><input type="checkbox" name="taxable"> Add sales tax</label>
        </div>
        <label class="field">Notes<textarea name="notes"></textarea></label>
      </details>

      <button class="primary" type="submit" style="width:100%; justify-content:center">Save</button>
      <p class="msg" id="msg"></p>
    </div>
  </form>

  <div class="card done" id="done" hidden>
    <h2>Saved</h2>
    <p class="desc" id="doneText"></p>
    <button class="primary" id="another">Add another</button>
  </div>
</div>

<script type="module">
import { combobox, splitCategory } from "/admin/combobox.js";

// Signed out (or signed in as someone not on the list): sign in, then come back here.
const toSignIn = () => { location.href = `/admin/login.html?next=${encodeURIComponent(location.pathname)}`; };
const $ = (id) => document.getElementById(id);
const form = $("form");
const money = (n) => (n == null ? "—" : new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format(n));
const opt = (value, text, selected) => { const o = document.createElement("option"); o.value = value; o.textContent = text; o.selected = Boolean(selected); return o; };
const today = () => new Date().toISOString().slice(0, 10);
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const recall = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
let options;
let chosen = null; // { item } for an existing item, or { name } for a new one

const label = (status) => options.statuses.find((s) => s.value === status)?.label || status;
const where = (o) => [o.category, o.subcategory].filter(Boolean).join(" › ");

/* ---------------------------------------------------------------- type-aheads -- */

combobox($("itemSearch"), {
  options: () => options.items.map((i) => ({
    label: i.item,
    detail: [where(i), i.purchases ? `${i.purchases} line item${i.purchases === 1 ? "" : "s"}` : label(i.status)].filter(Boolean).join(" · "),
    search: [i.item, i.category, i.subcategory, i.vendor].join(" "),
    item: i,
  })),
  create: (typed) => ({ label: `＋ New item “${typed}”`, name: typed }),
  onPick: (o) => choose(o.item ? { item: o.item } : { name: o.name }),
  empty: "Nothing yet.",
});

// Each category with each of its subcategories, so one pick fills in both.
function categoryOptions() {
  const pairs = new Map();
  for (const c of options.categories) pairs.set(c, [c, ""]);
  for (const i of options.items) if (i.category && i.subcategory) pairs.set(where(i), [i.category, i.subcategory]);
  return [...pairs.values()].sort((a, b) => where({ category: a[0], subcategory: a[1] }).localeCompare(where({ category: b[0], subcategory: b[1] })))
    .map(([category, subcategory]) => ({ label: where({ category, subcategory }), category, subcategory }));
}
combobox($("catSearch"), {
  options: categoryOptions,
  showAll: true,
  create: (typed) => (categoryOptions().some((o) => o.label.toLowerCase() === typed.toLowerCase()) ? null : { label: `＋ New category “${typed}”`, text: typed }),
  onPick: (o) => { $("catSearch").value = o.text ?? o.label; },
});

combobox($("vendor"), {
  options: () => options.vendors.map((v) => ({ label: v })),
  showAll: true,
  create: (typed) => (options.vendors.some((v) => v.toLowerCase() === typed.toLowerCase()) ? null : { label: `＋ New vendor “${typed}”`, text: typed }),
  onPick: (o) => { $("vendor").value = o.text ?? o.label; },
});

/* ----------------------------------------------------------------------- flow -- */

async function load() {
  const r = await fetch("/api/public/expense/options");
  if (r.status === 401) return toSignIn();
  options = await r.json();
  if (!r.ok) {
    $("fatal").textContent = options.error || "This form isn't available.";
    return;
  }
  const lastWho = options.me || recall("expense-form-who");
  $("who").replaceChildren(...options.payers.map((p) => opt(p, p, p === lastWho)));
  $("payer").replaceChildren(opt("", "—"), ...options.payers.map((p) => opt(p, p)));
  $("method").replaceChildren(opt("", "—"), ...options.payment_methods.map((m) => opt(m, m)));
  $("stages").replaceChildren(...options.statuses.map((s) => {
    const l = document.createElement("label");
    const input = Object.assign(document.createElement("input"), { type: "radio", name: "status", value: s.value });
    input.addEventListener("change", onStage);
    const span = document.createElement("span");
    span.textContent = s.label;
    l.append(input, span);
    return l;
  }));
  $("payer").value = $("who").value;
  $("whoWrap").hidden = false;
  form.hidden = false;
  choose(null);
}

const mode = () => $("mode").value;
const setStage = (s) => { form.querySelector(`input[name=status][value="${s}"]`).checked = true; onStage(); };
const stage = () => form.querySelector("input[name=status]:checked")?.value || "estimate";

function choose(next) {
  chosen = next;
  $("searchLabel").hidden = Boolean(chosen);
  $("chosen").hidden = !chosen;
  $("details").hidden = !chosen;
  $("msg").textContent = "";
  if (!chosen) {
    $("itemSearch").value = "";
    $("expenseId").value = "";
    return;
  }
  const item = chosen.item;
  $("expenseId").value = item ? item.id : "";
  if (item) {
    $("chosenName").textContent = item.item;
    $("chosenInfo").textContent = [
      where(item),
      item.purchases
        ? `${item.purchases} line item${item.purchases === 1 ? "" : "s"} · ${money(item.estimated)} estimated · ${money(item.incurred)} incurred · ${money(item.paid)} paid`
        : `${label(item.status)} · ${money(item.total)} · ${money(item.paid)} paid`,
    ].filter(Boolean).join(" · ");
  } else {
    $("chosenName").textContent = `New item: ${chosen.name}`;
    $("chosenInfo").textContent = "Pick its category below.";
  }
  // An item already split into line items only takes more line items.
  $("modes").hidden = !item || Boolean(item.purchases);
  // A new line item under the chosen item, unless they switch to updating it.
  setMode(item ? "purchase" : "new");
}

function setMode(m) {
  $("mode").value = m;
  const item = chosen.item;
  for (const b of $("modes").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.mode === m));
  $("modeNote").hidden = m !== "purchase";
  $("modeNote").textContent = item?.purchases
    ? `Adds a line item under ${item.item}.`
    : `Bought in pieces, or from more than one vendor? Line items go under ${item?.item}. What's already on it (price, vendor, stage, payments) becomes the first line item.`;
  $("itemLabel").hidden = m === "update";
  $("itemLabel").firstElementChild.textContent = m === "purchase" ? "What did you buy?" : "Name";
  form.item.required = m !== "update";
  form.item.placeholder = m === "purchase" ? "e.g. 40 dinner plates" : "";
  form.item.value = m === "new" ? chosen.name : "";
  $("catLabel").hidden = m !== "new";
  $("catSearch").value = "";
  $("mathFields").hidden = m === "update";
  if (m === "update") {
    $("priceLabel").firstElementChild.textContent = item.pricing === "variable" ? "Price per guest or unit ($)" : "Price ($)";
    form.price.value = item.unit_cost ?? "";
    $("vendor").value = item.vendor || "";
    setStage(item.status);
  } else {
    $("priceLabel").firstElementChild.textContent = "Price ($)";
    form.price.value = "";
    $("vendor").value = "";
    // Something just bought for an item is usually paid for on the spot.
    setStage(m === "purchase" ? "paid" : "estimate");
  }
  form.payment_amount.value = "";
  form.payment_amount.placeholder = m === "update" && item.owed ? `Owed: ${money(item.owed)}` : "Nothing yet";
}

// At the Paid stage the price is what's paid: no amount to type, just who/when/how.
function onStage() {
  const paid = stage() === "paid";
  $("amountLabel").hidden = paid;
  $("dueLabel").hidden = paid;
  if (paid) form.payment_amount.value = "";
  $("payNote").textContent = paid ? "Paid in full: the price is recorded as paid." : "Paid anything yet? Leave it blank if not.";
  onAmount();
}
function onAmount() {
  const show = stage() === "paid" || form.payment_amount.value !== "";
  for (const el of form.querySelectorAll(".paid-only")) el.hidden = !show;
}

for (const b of $("modes").querySelectorAll("button")) b.addEventListener("click", () => setMode(b.dataset.mode));
$("change").addEventListener("click", () => { choose(null); $("itemSearch").focus(); });
form.payment_amount.addEventListener("input", onAmount);
$("who").addEventListener("change", () => { $("payer").value = $("who").value; });

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (mode() === "new" && !$("catSearch").value.trim()) {
    $("msg").textContent = "Pick a category (or type a new one).";
    $("msg").className = "msg err";
    return;
  }
  const button = form.querySelector("button[type=submit]");
  button.disabled = true;
  $("msg").textContent = form.file.files[0] ? "Saving and uploading…" : "Saving…";
  $("msg").className = "msg";
  const data = new FormData(form);
  data.set("submitted_by", $("who").value);
  // Who/when/how only mean something when money changed hands.
  if (stage() !== "paid" && !data.get("payment_amount")) for (const k of ["paid_on", "payer", "method"]) data.delete(k);
  if (mode() === "update") {
    data.delete("item");
    for (const k of ["units", "gratuity_percent", "taxable"]) data.delete(k);
  }
  if (mode() === "new") {
    const [category, subcategory] = splitCategory($("catSearch").value);
    data.set("category", category);
    data.set("subcategory", subcategory);
  }
  try {
    const r = await fetch("/api/public/expense", { method: "POST", body: data, headers: { "x-wedding": "1" } });
    if (r.status === 401) return toSignIn();
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || "Couldn't save.");
    remember("expense-form-who", $("who").value);
    $("doneText").textContent = body.receipt_error ? body.receipt_error : body.receipt ? `Saved, with ${body.receipt} in Google Drive.` : "Saved.";
    form.hidden = true;
    $("done").hidden = false;
  } catch (error) {
    $("msg").textContent = error.message;
    $("msg").className = "msg err";
  } finally {
    button.disabled = false;
  }
});

$("another").addEventListener("click", async () => {
  form.reset();
  $("done").hidden = true;
  await load();
  $("paidOn").value = today();
});

load().then(() => { $("paidOn").value = today(); }).catch(() => { $("fatal").textContent = "Couldn't load the form. Check your connection and try again."; });
</script>
</body>
</html>
